<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1220" />
  <title>Price Guess</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="phone">
    <header>
      <span><span id="dot" class="status-dot"></span><span id="status" class="muted">Connecting…</span></span>
      <strong id="tableLabel"></strong>
    </header>
    <div id="app"></div>
    <div id="notice" class="notice hidden"></div>
  </div>

  <script type="module">
    import { connect, formatCents, esc, secondsLeft } from "/common.js";

    // One random id per phone, kept across refreshes so the phone keeps its table.
    let token = null;
    try { token = localStorage.getItem("pg-token"); } catch {}
    if (!token) {
      token = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { localStorage.setItem("pg-token", token); } catch {}
    }

    const app = document.getElementById("app");
    const notice = document.getElementById("notice");
    let view = null;
    let changingTable = false;
    let draft = ""; // what the user is typing; survives re-renders
    let lastRenderKey = "";
    let lastPhase = "";

    const conn = connect({
      params: { role: "player", token },
      onState: (v) => { view = v; if (v.myTable) changingTable = false; render(); },
      onError: (e) => showNotice(e.message, "error"),
      onAck: () => showNotice("Submitted! You can change it until time's up.", "ok"),
      onStatus: (s) => {
        document.getElementById("dot").className = `status-dot ${s}`;
        document.getElementById("status").textContent = s === "online" ? "Connected" : s === "connecting" ? "Connecting…" : "Reconnecting…";
      },
    });

    function showNotice(text, kind) {
      notice.textContent = text;
      notice.className = `notice ${kind}`;
      clearTimeout(showNotice.t);
      showNotice.t = setTimeout(() => notice.classList.add("hidden"), 4000);
    }

    function render() {
      if (!view) return;
      document.getElementById("tableLabel").textContent = view.myTable ? `Table ${view.myTable}` : "";
      const phaseKey = `${view.phase}|${view.roundNumber}|${view.isTiebreak}`;
      if (phaseKey !== lastPhase) { lastPhase = phaseKey; notice.classList.add("hidden"); }
      // While a round is open, other tables submitting must NOT rebuild the page
      // (that would close the phone keyboard), so the key ignores the global version.
      const key = view.phase === "open" && view.myTable && !changingTable
        ? ["open", view.roundNumber, view.isTiebreak, view.myTable, view.myBid?.cents ?? ""].join("|")
        : [view.version, view.phase, view.myTable, changingTable].join("|");
      if (key === lastRenderKey) return tick();
      lastRenderKey = key;

      if (!view.myTable || changingTable) return renderPickTable();
      const roundLabel = view.isTiebreak ? "Tiebreaker"
        : view.isPractice ? `Practice ${view.practiceNumber} of ${view.practiceTotal} (doesn't count)`
        : `Round ${view.roundNumber} of ${view.totalRounds}`;
      const inTiebreak = view.isTiebreak && view.tiebreakTables.includes(view.myTable);

      // Tiebreaker: tables that aren't tied just watch.
      if (view.isTiebreak && !inTiebreak && (view.phase === "waiting" || view.phase === "open" || view.phase === "locked")) {
        app.innerHTML = `
          <div class="card">
            <h1>⚔ Tiebreaker</h1>
            <p>Tables <strong>${view.tiebreakTables.join(", ")}</strong> are tied for first place and are playing one more question.</p>
            <p class="muted">Your table doesn't need to answer — watch the big screen!</p>
          </div>
          ${view.phase === "open" ? `<div class="countdown" id="cd"></div>` : ""}`;
        return tick();
      }

      if (view.phase === "waiting" && view.isTiebreak) {
        app.innerHTML = `
          <div class="card">
            <h1>⚔ Tiebreaker!</h1>
            <p>Your table is <strong>tied for first place</strong> with Table ${view.tiebreakTables.filter((t) => t !== view.myTable).join(", ")}.</p>
            <p class="muted">One more question, ${view.roundSeconds} seconds. Closest without going over wins.
            If everyone goes over, the closest guess wins; if still tied, we draw lots.</p>
          </div>`;
        return;
      }

      if (view.phase === "waiting") {
        app.innerHTML = `
          <div class="card">
            ${view.isPractice ? `<div class="notice" style="margin-bottom:10px">🏋️ Practice first — it doesn't count!</div>`
              : view.practiceDone && view.roundNumber === 1 ? `<div class="notice ok" style="margin-bottom:10px">✅ Practice over — now it counts!</div>` : ""}
            <h1>You're in! 🎉</h1>
            <p class="muted">${esc(roundLabel)} is about to start. Watch the big screen —
            when the next item appears you'll have <strong>${view.roundSeconds} seconds</strong> to enter
            your table's guess. ${esc(view.guessPrompt)}</p>
            <p><strong>Closest without going over wins the round.</strong></p>
          </div>
          ${standingsMini()}
          <button class="link-btn" id="change">Wrong table? Change it</button>`;
        document.getElementById("change").onclick = () => { changingTable = true; render(); };
        return;
      }

      if (view.phase === "open") {
        const mine = view.myBid ? formatCents(view.myBid.cents) : null;
        app.innerHTML = `
          <div class="countdown" id="cd"></div>
          <div class="card">
            <div class="muted">${esc(roundLabel)}</div>
            <h1>${esc(view.dish?.name ?? "")}</h1>
            ${view.dish?.image ? `<img src="${esc(view.dish.image)}" alt="" style="width:100%;border-radius:10px;margin-top:8px">` : ""}
            <ul class="ingredients">${(view.dish?.ingredients ?? []).map((i) => `<li>${esc(i)}</li>`).join("")}</ul>
          </div>
          <form class="bid-form" id="bid" autocomplete="off">
            <div class="input-wrap"><span>$</span>
              <input id="price" inputmode="decimal" enterkeyhint="send" placeholder="0.00" aria-label="Your price guess" />
            </div>
            <button type="submit">${mine ? "Update" : "Submit"}</button>
          </form>
          <div class="muted" id="mine">${mine ? `Your table's guess: <strong class="price">${mine}</strong>` : `${esc(view.guessPrompt)} Don't go over!`}</div>`;
        const input = document.getElementById("price");
        input.value = draft;
        input.oninput = () => (draft = input.value);
        document.getElementById("bid").onsubmit = (e) => {
          e.preventDefault();
          if (!input.value.trim()) return showNotice("Type a price first, e.g. 30.75", "error");
          conn.send({ t: "submit", price: input.value });
          input.blur();
        };
        if (!mine) input.focus();
        return tick();
      }

      draft = "";
      if (view.phase === "locked") {
        app.innerHTML = `
          <div class="card big-result">⏱️ Time's up!</div>
          <div class="card">${view.myBid
            ? `Your table guessed <strong class="price">${formatCents(view.myBid.cents)}</strong>.`
            : `<span class="bad">Your table didn't submit a guess this round.</span>`}
            <p class="muted">Waiting for the host to reveal the price…</p></div>`;
        return;
      }

      if (view.phase === "revealed") {
        const r = view.result;
        const me = r.entries.find((e) => e.table === view.myTable);
        const what = view.isTiebreak ? "the tiebreaker" : view.isPractice ? "this practice round (doesn't count)" : "this round";
        let verdict = inTiebreak || !view.isTiebreak ? `<span class="muted">No guess from your table.</span>` : "";
        if (me?.winner) verdict = `<span class="good">🏆 Your table wins ${what}!</span>`;
        else if (me && view.isTiebreak) verdict = `Not this time — Table ${r.winners[0]} wins the tiebreaker.`;
        else if (me?.over) verdict = `<span class="bad">Over by ${formatCents(-me.diff)} — disqualified.</span>`;
        else if (me) verdict = `Under by <span class="price">${formatCents(me.diff)}</span>.`;
        app.innerHTML = `
          <div class="card">
            <div class="muted">${esc(view.dish?.name ?? "")}</div>
            <div class="big-result">Actual: <span class="price">${formatCents(r.priceCents)}</span></div>
            <p style="text-align:center;font-size:20px">${verdict}</p>
            <p style="text-align:center">${view.isTiebreak
              ? `Tiebreaker winner: <strong>Table ${r.winners[0]}</strong><br><span class="muted">${
                  r.decidedBy === "under" ? "Closest without going over." : r.decidedBy === "closest" ? "Everyone went over — closest guess wins." : "Still tied — drawn by lot."}</span>`
              : r.winners.length ? `${view.isPractice ? "Practice winner" : "Round winner"}: <strong>Table ${r.winners.join(", ")}</strong>`
              : "Nobody won — every guess went over."}</p>
          </div>
          <div class="card"><ul class="list">${r.entries.map((e) => `
            <li class="${e.winner ? "win" : e.over ? "over" : ""} ${e.table === view.myTable ? "me" : ""}">
              <span>Table ${e.table}</span><span class="price">${formatCents(e.cents)}</span></li>`).join("")}
          </ul></div>`;
        return;
      }

      if (view.phase === "final") {
        const lead = view.leaders;
        const champ = view.champion;
        const mine = view.standings.find((s) => s.table === view.myTable);
        const headline = champ
          ? champ.table === view.myTable ? "🏆 Your table is the champion!" : `🏆 Table ${champ.table} is the champion!`
          : lead.length > 1 ? `Tie for first: Tables ${lead.join(", ")}${view.canStartTiebreak ? " — tiebreaker coming up!" : ""}` : "Game over";
        app.innerHTML = `
          <div class="card big-result">${headline}</div>
          <div class="card">Your table won <strong>${mine?.wins ?? 0}</strong> round(s).</div>
          ${standingsMini(true)}`;
      }
    }

    function renderPickTable() {
      const taken = new Set(view.claimedTables);
      app.innerHTML = `
        <div class="card"><h1>Which table are you at?</h1>
        <p class="muted">Only <strong>one phone per table</strong> joins.</p></div>
        <div class="table-grid">${Array.from({ length: view.tables }, (_, i) => i + 1).map((t) =>
          `<button class="${t === view.myTable ? "" : "secondary"}" data-t="${t}" ${taken.has(t) && t !== view.myTable ? "disabled" : ""}>${t}</button>`).join("")}
        </div>
        ${view.myTable ? `<button class="link-btn" id="cancel">Keep Table ${view.myTable}</button>` : ""}
        <p class="muted" style="font-size:14px">Greyed-out tables have already joined. If your table's phone died, ask the host to release it.</p>`;
      app.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => conn.send({ t: "claim", table: Number(b.dataset.t) })));
      const cancel = document.getElementById("cancel");
      if (cancel) cancel.onclick = () => { changingTable = false; render(); };
    }

    function standingsMini(all = false) {
      const rows = view.standings.filter((s) => all || s.wins > 0);
      if (!rows.length) return "";
      return `<div class="card"><div class="muted" style="margin-bottom:6px">Rounds won</div><ul class="list">${rows.map((s) =>
        `<li class="${s.table === view.myTable ? "me" : ""}"><span>#${s.rank} Table ${s.table}</span><span>${s.wins}</span></li>`).join("")}</ul></div>`;
    }

    function tick() {
      const cd = document.getElementById("cd");
      if (!cd || view?.phase !== "open") return;
      const left = secondsLeft(view.deadline, conn.serverNow());
      cd.textContent = left > 0 ? left : "0";
      cd.classList.toggle("urgent", left <= 5);
    }
    setInterval(tick, 200);
  </script>
</body>
</html>
